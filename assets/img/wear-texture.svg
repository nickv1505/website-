<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <!-- Overlay used on "before" images: uneven, faded paint + light scuffs.
       Blended with mix-blend-mode: multiply, so white = no change. -->
  <filter id="blotch" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.006" numOctaves="4" seed="7"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.9  0 0 0 0 0.82  0 0 0 -2.2 1.35"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.53  0 0 0 0 0.5  0 0 0 -1.4 0.72"/>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  <rect width="1600" height="1000" fill="#fff"/>
  <rect width="1600" height="1000" filter="url(#blotch)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.35"/>
  <g filter="url(#soft)" stroke="#8d877c" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M210 610 q40 -8 90 4" stroke-width="5"/>
    <path d="M232 632 q30 -4 58 2" stroke-width="3"/>
    <path d="M1180 540 q-36 10 -84 6" stroke-width="4"/>
    <path d="M760 300 q22 30 12 70" stroke-width="3"/>
    <path d="M1420 720 q-50 -6 -96 8" stroke-width="5"/>
    <path d="M520 760 q60 -12 120 0" stroke-width="4"/>
    <path d="M980 190 q18 -6 40 4" stroke-width="3"/>
  </g>
  <g filter="url(#soft)" fill="#a39c8f" opacity="0.28">
    <ellipse cx="380" cy="420" rx="46" ry="30"/>
    <ellipse cx="1260" cy="330" rx="60" ry="36"/>
    <ellipse cx="880" cy="640" rx="38" ry="24"/>
  </g>
</svg>
